name: Pearl iOS Wallet (unsigned IPA)

# Builds an UNSIGNED .ipa on a GitHub macOS runner (no EAS/Expo cloud).
# Sign + install with Sideloadly/AltStore using a free Apple ID (7-day expiry).
on:
  workflow_dispatch:
  push:
    branches: [ios-wallet]
    paths:
      - 'apps/apps/pearl-ios-wallet/**'
      - 'apps/pnpm-lock.yaml'
      - '.github/workflows/pearl-ios-wallet.yml'
      - 'wallet/**'
      - 'spv/**'
      - 'node/**'
      - 'zk-pow/**'
      - 'xmss/**'

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8.15.6'
  APP_DIR: 'apps/apps/pearl-ios-wallet'

jobs:
  ipa:
    runs-on: macos-26 # Expo SDK 57 needs Swift 6.2 (Xcode 26)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Embedded oyster (SPV wallet) as a static lib for the app.
      - uses: ./.github/actions/setup

      - name: Build oyster for iOS (zk-pow + xmss + Go c-archive)
        env:
          CGO_ENABLED: 1
          CGO_LDFLAGS_ALLOW: '.*zk_pow_ffi.*'
        run: |
          set -eux
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun -sdk iphoneos -f clang)
          CLANGXX=$(xcrun -sdk iphoneos -f clang++)
          export IPHONEOS_DEPLOYMENT_TARGET=15.1
          (cd zk-pow && cargo run --release --no-default-features --bin build_cache src/circuit/v2_cache.bin src/v1/v1_cache.bin)
          rustup target add aarch64-apple-ios
          (cd zk-pow/bindings/go && cargo build --release --target aarch64-apple-ios)
          # node/zkpow/verify.go links target/release/ for darwin (GOOS=ios implies darwin).
          mkdir -p zk-pow/bindings/go/target/release
          cp zk-pow/bindings/go/target/aarch64-apple-ios/release/libzk_pow_ffi.a zk-pow/bindings/go/target/release/
          make -C xmss CC="$CLANG -isysroot $SDK -arch arm64 -miphoneos-version-min=15.1" \
            CXX="$CLANGXX -isysroot $SDK -arch arm64 -miphoneos-version-min=15.1" AR="$(xcrun -sdk iphoneos -f ar)" lib
          GOOS=ios GOARCH=arm64 CC="$CLANG -isysroot $SDK -arch arm64 -miphoneos-version-min=15.1" \
            CXX="$CLANGXX -isysroot $SDK -arch arm64 -miphoneos-version-min=15.1" \
            go build -buildmode=c-archive -tags xmss,zkpow -o build-ios/liboysterwallet.a ./wallet
          L=$APP_DIR/modules/oyster/ios/lib
          mkdir -p $L
          cp build-ios/liboysterwallet.a build-ios/liboysterwallet.h xmss/libxmss.a zk-pow/bindings/go/target/release/libzk_pow_ffi.a $L/
          ls -la $L

      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.7
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        working-directory: apps
        run: pnpm install --frozen-lockfile --filter pearl-ios-wallet...

      - name: Generate native iOS project
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec expo prebuild -p ios --clean

      - name: Build (unsigned)
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry PearlWallet-unsigned.ipa Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pearl-ios-wallet-unsigned-ipa
          path: ${{ env.APP_DIR }}/ios/PearlWallet-unsigned.ipa
          if-no-files-found: error
